[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/analyze-link"
  to = "/.netlify/functions/analyze-link"
  status = 200

[[redirects]]
  from = "/api/ai-status"
  to = "/.netlify/functions/ai-status"
  status = 200

[[redirects]]
  from = "/api/auth/forgot-password"
  to = "/.netlify/functions/auth-password?action=forgot"
  status = 200

[[redirects]]
  from = "/api/auth/reset-password"
  to = "/.netlify/functions/auth-password?action=reset"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
