<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Center Artwork -->
  <g filter="url(#shadow)" fill="none" stroke="url(#glyphGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Reel / Media Frame -->
    <rect x="110" y="110" width="292" height="292" rx="60" />

    <!-- Film Sprockets / Reel markers -->
    <circle cx="160" cy="160" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="352" cy="160" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="160" cy="352" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="352" cy="352" r="14" fill="#FFFFFF" stroke="none" />

    <!-- Play & Sparkle in the Center -->
    <polygon points="230,205 320,256 230,307" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- AI Sparkle Badge on top right -->
  <g transform="translate(330, 85)">
    <circle cx="50" cy="50" r="44" fill="#F59E0B" />
    <path d="M50,22 L55,42 L75,50 L55,58 L50,78 L45,58 L25,50 L45,42 Z" fill="#FFFFFF" />
  </g>
</svg>
